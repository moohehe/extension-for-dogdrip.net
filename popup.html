<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <style>
        body {
            width: 230px;
            padding: 14px 16px;
            font-family: sans-serif;
            font-size: 13px;
            color: #333;
            margin: 0;
        }
        h3 {
            margin: 0 0 12px;
            color: #2e4361;
            font-size: 14px;
            border-bottom: 2px solid #2e4361;
            padding-bottom: 6px;
        }
        .row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 0;
            border-bottom: 1px solid #eee;
        }
        .keys {
            font-family: monospace;
            display: flex;
            gap: 3px;
            align-items: center;
        }
        kbd {
            background: #eee;
            border: 1px solid #ccc;
            border-radius: 3px;
            padding: 1px 5px;
            font-size: 11px;
        }
        .desc {
            color: #555;
        }
        .note {
            margin-top: 10px;
            font-size: 11px;
            color: #999;
            line-height: 1.5;
        }
        a { color: #2e4361; }
    </style>
</head>
<body>
    <h3>Dogdrip 확장프로그램</h3>
    <div class="row">
        <div class="keys"><kbd>Ctrl</kbd>+<kbd>←</kbd></div>
        <span class="desc">이전 게시글</span>
    </div>
    <div class="row">
        <div class="keys"><kbd>Ctrl</kbd>+<kbd>→</kbd></div>
        <span class="desc">다음 게시글</span>
    </div>
    <div class="row">
        <div class="keys"><kbd>Ctrl</kbd>+<kbd>↓</kbd></div>
        <span class="desc">목록 이동 + 단축키</span>
    </div>
    <p class="note">
        게시글 페이지에서 동작합니다.<br>
        건의: <a href="mailto:moohehe@hanmail.net">moohehe@hanmail.net</a>
    </p>
</body>
</html>
